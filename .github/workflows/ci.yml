          useDaemon: false
      - name: Allow the unprivileged user namespaces Nix and passt need
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0; sudo sysctl -w kernel.unprivileged_userns_clone=1; unshare --user --map-root-user --mount --pid --fork --mount-proc true
        timeout-minutes: 5
      - name: 'Run lan on uml: two guests on a segment see each other'
        run: nix build --no-link --print-build-logs --keep-going --file . lan
        timeout-minutes: 35
    timeout-minutes: 45
  test-memory:
    env:
      UMBRELLA_REV: ${{ needs.umbrella-rev.outputs.rev }}
    if: '!cancelled() && (needs.kernel.result == ''success'' || needs.kernel.result == ''skipped'') && (github.event_name != ''workflow_dispatch'' || inputs.jobs == '''' || contains(format('',{0},'', inputs.jobs), '',test-memory,''))'
    needs:
      - kernel
      - umbrella-rev
    runs-on: ubuntu-24.04
    steps:
      - timeout-minutes: 10
        uses: actions/checkout@main
      - if: runner.os == 'Linux'
        name: Make room on the runner
        run: df -h /; sudo rm -rf /usr/lib/jvm /usr/share/dotnet /usr/share/swift /usr/local/.ghcup /usr/local/julia* /usr/local/lib/android /opt/az /usr/local/share/powershell /usr/local/share/chromium /opt/microsoft /opt/google /usr/lib/firefox; docker system prune --all --force; docker builder prune --all --force; df -h /
        timeout-minutes: 10
      - timeout-minutes: 15
        uses: cachix/install-nix-action@master
        with:
          extra_nix_config: |
            access-tokens = github.com=${{ github.token }}
            cores = 4
            experimental-features = nix-command flakes
            max-jobs = 1
      - timeout-minutes: 15
        uses: cachix/cachix-action@master
        with:
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          name: lillecarl
          pushFilter: (-uml-test-)
          useDaemon: false
      - name: Allow the unprivileged user namespaces Nix and passt need
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0; sudo sysctl -w kernel.unprivileged_userns_clone=1; unshare --user --map-root-user --mount --pid --fork --mount-proc true
        timeout-minutes: 5
      - name: 'Run memory on uml: a guest gives its memory back'
        run: nix build --no-link --print-build-logs --keep-going --file . memory
        timeout-minutes: 10
    timeout-minutes: 20
  umbrella-rev:
    outputs:
      rev: ${{ steps.resolve.outputs.rev }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 100
      - id: resolve
        name: Resolve the umbrella revision
        run: ci/walkback.sh https://github.com/nixidae/nixidae user-mode-nixos | sed 's/^/rev=/' >> "$GITHUB_OUTPUT"
    timeout-minutes: 5
name: CI
on:
  pull_request: {}
  push: {}
  workflow_dispatch:
    inputs:
      jobs:
        default: ""
        description: Comma-separated job IDs to run; empty runs all of them
        required: false
        type: string
